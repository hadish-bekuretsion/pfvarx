# PfVarX reference and mask manifest
#
# Declares the reference assemblies and callable-region masks that a run may
# use. Every entry is pinned by a SHA-256 digest so that a run can prove which
# reference it used. A VALIDATED policy requires an entry from this manifest.
#
# Populate `sha256` with the real digest before use:
#   sha256sum reference/Pf3D7.fa
#
schema_version: 1

references:
  - assembly_id: Pf3D7_01_v3
    organism: Plasmodium falciparum
    source: PlasmoDB
    release: "68"
    description: >-
      P. falciparum 3D7 reference, chromosome 1 (nuclear), as distributed by
      PlasmoDB release 68 and used by MalariaGEN Pf7.
    path: reference/Pf3D7_01_v3.fa
    sha256: REQUIRED_SHA256
    nuclear_ploidy: 1
    contigs:
      - Pf3D7_01_v3
    masks:
      - mask_id: Pf3D7_01_v3_callable
        path: reference/Pf3D7_01_v3.callable.bed
        sha256: REQUIRED_SHA256
        excludes:
          - subtelomeric_repeats
          - var_gene_families
          - rifin_gene_families
          - stevor_gene_families
          - low_complexity

  - assembly_id: Pf3D7_full
    organism: Plasmodium falciparum
    source: PlasmoDB
    release: "68"
    description: >-
      Complete P. falciparum 3D7 reference: 14 nuclear chromosomes plus the
      apicoplast and mitochondrial genomes.
    path: reference/Pf3D7.fa
    sha256: REQUIRED_SHA256
    nuclear_ploidy: 1
    contigs:
      - Pf3D7_01_v3
      - Pf3D7_02_v3
      - Pf3D7_03_v3
      - Pf3D7_04_v3
      - Pf3D7_05_v3
      - Pf3D7_06_v3
      - Pf3D7_07_v3
      - Pf3D7_08_v3
      - Pf3D7_09_v3
      - Pf3D7_10_v3
      - Pf3D7_11_v3
      - Pf3D7_12_v3
      - Pf3D7_13_v3
      - Pf3D7_14_v3
      - Pf3D7_API_v3
      - Pf3D7_MIT_v3
    masks:
      - mask_id: Pf3D7_full_callable
        path: reference/Pf3D7.callable.bed
        sha256: REQUIRED_SHA256
        excludes:
          - subtelomeric_repeats
          - var_gene_families
          - rifin_gene_families
          - stevor_gene_families
          - low_complexity

# Annotation resources (optional; internal fallback used when absent)
annotation:
  - resource_id: Pf3D7_gff3
    path: reference/Pf3D7.gff3
    sha256: REQUIRED_SHA256
    description: PlasmoDB GFF3 annotation for Pf3D7.
  - resource_id: Pf3D7_snpeff_db
    path: reference/snpeff/Pf3D7
    sha256: null
    description: Optional SnpEff database directory for Pf3D7.
